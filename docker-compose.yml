services:
  mongo:
    image: mongo:6-jammy
    container_name: agritrace-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "db.adminCommand('ping').ok"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
    container_name: agritrace-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      FLASK_ENV: production
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "5000"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: agritracebio
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please}
      JWT_ALGORITHM: HS256
      JWT_EXPIRES_HOURS: "24"
      UPLOADS_DIR: /app/uploads
      MAX_UPLOAD_MB: "10"
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "5000:5000"

volumes:
  mongo_data:
  backend_uploads:
